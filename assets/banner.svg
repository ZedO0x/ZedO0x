<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">ZedO0x — Offensive Security Researcher</title>
  <desc id="d">Web and API security, bug bounty, reconnaissance, Linux privilege escalation, AI red teaming.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A1414" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#FF1E2D" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#B00020" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#FF1E2D"/>
      <stop offset="0.45" stop-color="#B00020"/>
      <stop offset="1" stop-color="#292020" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="#080808"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" fill="none" stroke="#292020"/>

  <!-- corner brackets -->
  <g stroke="#FF1E2D" stroke-width="2" fill="none">
    <path d="M24 56V24H56"/>
    <path d="M1224 24H1256V56"/>
    <path d="M24 284V316H56"/>
    <path d="M1224 316H1256V284"/>
  </g>

  <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
    <text x="72" y="92" font-size="16" fill="#A1A1AA" letter-spacing="2">
      <tspan fill="#FF1E2D">//</tspan> ZedO0x <tspan fill="#292020">|</tspan> OSCP CANDIDATE
    </text>

    <text x="70" y="160" font-size="54" font-weight="700" fill="#F5F5F5" letter-spacing="1">OFFENSIVE SECURITY</text>
    <text x="70" y="218" font-size="54" font-weight="700" fill="#FF1E2D" letter-spacing="1">RESEARCHER</text>

    <rect x="72" y="240" width="520" height="2" fill="url(#rule)"/>

    <text x="72" y="276" font-size="17" fill="#A1A1AA">
      Web &amp; API Security <tspan fill="#B00020">·</tspan> Bug Bounty <tspan fill="#B00020">·</tspan> Recon <tspan fill="#B00020">·</tspan> Linux PrivEsc <tspan fill="#B00020">·</tspan> AI Red Teaming
    </text>
  </g>

  <!-- terminal card -->
  <g transform="translate(860 112)" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="14">
    <rect width="340" height="150" rx="6" fill="#111111" stroke="#292020"/>
    <rect width="340" height="28" rx="6" fill="#161010"/>
    <rect y="22" width="340" height="6" fill="#161010"/>
    <circle cx="18" cy="14" r="4.5" fill="#FF1E2D"/>
    <circle cx="34" cy="14" r="4.5" fill="#B00020"/>
    <circle cx="50" cy="14" r="4.5" fill="#292020"/>
    <text x="170" y="18.5" font-size="11" fill="#A1A1AA" text-anchor="middle">lab — authorized scope only</text>
    <text x="16" y="56" fill="#A1A1AA"><tspan fill="#FF1E2D">$</tspan> whoami</text>
    <text x="16" y="78" fill="#F5F5F5">security researcher</text>
    <text x="16" y="106" fill="#A1A1AA"><tspan fill="#FF1E2D">$</tspan> cat focus.txt</text>
    <text x="16" y="128" fill="#F5F5F5">recon → access control → impact</text>
  </g>
</svg>
